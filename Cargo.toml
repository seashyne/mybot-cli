[package]
name = "mybot"
version = "0.2.0"
edition = "2024"
description = "mybot cli - a terminal AI coding agent"
license = "MIT"

[lib]
name = "mybot"
path = "src/lib.rs"

[[bin]]
name = "mybot"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
async-stream = "0.3"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
crossterm = { version = "0.29.0", optional = true }
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
ignore = "0.4.34"
libc = "0.2.191"
ratatui = { version = "0.30.2", optional = true }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.2.2"
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.2.2"
axum = "0.8.9"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
predicates = "3.1.4"

[[bench]]
name = "core"
harness = false
