name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm --no-progress

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  scripts:
    name: check installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check shell & npm installer syntax
        run: |
          sh -n install.sh
          node --check npm/scripts/install.js
          node --check npm/bin/mybot.js
