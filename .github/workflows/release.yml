name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cmake_arch: ""
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cmake_arch: ""
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cmake_arch: ""
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            cmake_arch: ""
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cmake_arch: ""
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm --no-progress

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_arch }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/mybot${{ matrix.ext }}"
          out="mybot-${{ matrix.target }}${{ matrix.ext }}"
          cp "$bin" "$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "mybot-${{ matrix.target }}.zip" "$out"
            ls -lh "$out" "mybot-${{ matrix.target }}.zip"
          else
            tar -czf "mybot-${{ matrix.target }}.tar.gz" "$out"
            ls -lh "$out" "mybot-${{ matrix.target }}.tar.gz"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mybot-${{ matrix.target }}
          path: |
            mybot-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum mybot-* > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mybot-*
            dist/sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    name: publish npm package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Publish (skipped without NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          cd npm
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public
